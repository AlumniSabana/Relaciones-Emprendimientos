name: Pruebas

# Cada push y cada pull request corre las pruebas de datos y de la web, y certifica las relaciones del grafo.
on:
  push:
  pull_request:

jobs:
  datos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas scikit-learn openpyxl pytest
      - run: pytest -q
      # Certificación de relaciones: falla si graph.json o matches.json rompen el contrato.
      - run: python tools/certify.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
